<script type="application/json" id="spec-source">
"# 邪魔すぎる花火メモ帳 企画仕様書\n版：初稿0.1／2026年10月21日\n位置付け：「クソアプリ2026」の記事内iframeで遊ぶメモ帳。仮の呼び名は「ドパガキメモ帳」。花火の気持ちよさ、密度、音、間は実際の体験を見て相談する項目とする。\n## 企画の核\n文字を入力すると花火が上がる。Enterで改行するとさらに大きな花火が連発し、入力した文章が見えなくなる。文章を書こうとして開いたはずが、花火を出すためにキーを押したくなるメモ帳。\n花火は画面の隅で控えめに飾るものではなく、本文へ大きく重なって視界を邪魔する。入力と演出の反応がすぐ結び付き、連続入力すると画面が騒がしくなるところを中心にする。\n本文は普通に入力、編集、保存できる。「邪魔」は視覚と音の演出として作り、入力した内容が失われることをネタにしない。\n## 初稿で定めることと相談すること\n|項目|扱い|\n|---|---|\n|通常入力で花火|企画の核。確定した文字入力に反応する|\n|Enterで大きな連発|企画の核。実際に改行が挿入されたときに反応する|\n|本文への重なり|企画の核。読みにくくなるほど主張する|\n|編集と保存|確実に動く基本機能。演出の負荷と切り離す|\n|打上げから爆発までの間|初稿の候補値を置き、短い体験で相談する|\n|同時に上がる数、色、残光、音|相談項目。数値だけで最適と決めない|\n|Backspaceや貼り付けの特別演出|候補。通常入力とEnterの感触ができてから採否を決める|\n## 起動から最初の10秒\n最初から大きなメモ欄を表示する。案内は「文字を入力。Enterで大花火。」程度にとどめる。入力欄に触れて文字を打つと、カーソル付近で火花が出て、すぐに一発目が上がる。\n短い文を書くだけで複数の花火が重なり、Enterを押すと本文を覆う大きな連発になる。入力を止めれば残光が数秒で消え、自分が何を書いたのかを読み返せる。\n画面の派手さを説明する長文や、演出を起動するための毎回の確認は置かない。最初の実入力だけで違いが分かる体験にする。\n## 見た目\n夜空のような暗い背景に、読みやすい明るい本文を置く。メモ帳部分は通常の編集欄として見え、余計なゲームの計器を並べない。カーソルと選択範囲は保つ。\n花火は本文と同じ領域の手前に重ねる。大輪、散る小花、垂れる火花など、形と時間変化の異なる演出を混ぜる。色の丸が一瞬出て消えるだけで花火と扱わない。\n爆発の中心は同じ場所に固定せず、カーソル付近から上方や左右へ広がる。画面外で爆発して何も見えない状態を避ける。Enterの連発では、画面の複数箇所が順に開く構成を第一案とする。\n派手さは花の大きさ、残光、重なり、音の組合せで作る。全面を白黒に高速反転させる方法は使わない。\n## 入力ごとの演出案\n以下の個数と時間は試作用の値であり、体験を見て決める。\n|入力|演出の初稿|反応の目安|\n|---|---|---|\n|通常の確定入力|カーソル付近に火花、続いて1〜3輪|火花は入力後すぐ、開花は80〜180ms後|\n|連続入力|前の花火が残ったまま次が重なる|入力のたびに反応。密度を数秒かけて上げる|\n|実際の改行|大輪と追い打ちを5〜8発|最初の反応はすぐ、全体は0.6〜1秒|\n|入力を止めた|残光だけが落ちて静まる|およそ2〜3秒で本文を読める|\n|Backspace|火花がカーソルへ吸い戻される案|採否は相談。削除そのものは普通に実行|\n|貼り付け|まとまった打上げを1回出す案|文字数と同数の粒子を無制限に作らない|\nキーを押してから打上げを眺めるだけの待ち時間を作らず、入力直後の小さな火花と、その後の大きい開花を分けて反応を感じさせる。音も、最初の反応と開花の位置を合わせる。\n「打つほど気持ちよい」「Enterをもう一度押したくなる」という体験は、上の数値を守っただけでは完成としない。最初に10〜20秒程度の入力体験で感触を確認する。\n## メモ帳としての操作\n|機能|仕様|\n|---|---|\n|文字入力|日本語、英数字、絵文字、改行を通常どおり入力できる|\n|編集|選択、削除、カーソル移動、コピー、貼り付けを利用できる|\n|Undo／Redo|ブラウザーの通常の編集履歴を維持する|\n|自動保存|編集した本文を保持する。演出完了を保存の条件にしない|\n|書出し|UTF-8のテキストファイルとして保存する|\n|演出量|常時見える小さな設定から切り替える|\n|音|オン・オフと音量を分けて操作できる|\n|一時停止|花火を止めて本文を読み返せる。本文はそのまま残る|\n設定は本文から離れた小さな帯に集め、花火を見たいときに設定画面を何度も開く必要をなくす。\n## 日本語入力とイベントの扱い\n本文の編集は標準のtextareaを第一案とし、キー入力を独自のテキストエンジンで再実装しない。花火のレイヤーはポインター操作を透過させ、文字選択やカーソル移動を妨げない。\n日本語の変換中、候補移動、変換確定に使ったEnterを、大花火の改行として数えない。keydownだけで判定せず、実際の本文変更と入力イベントから、確定文字と改行の挿入を区別する。\n変換中に複数回届くイベントは、確定時の一度の演出へまとめる。入力が確定した際の花火は出すが、同じ確定文字に対して重複して発火させない。スマートフォンでも物理キーボードの有無に依存しない。\nコピー操作、カーソル移動、文字の選択だけでは入力花火を発生させない。Undoで改行が戻った場合も、新しくEnterを押したと同じ大花火を勝手に出さない。\n連続した絵文字や結合文字は、表示上のまとまりを基準に扱う。UTF-16のコード単位数をそのまま花火の発数へ変換しない。\n## 演出の強度\n強度は「にぎやか」「邪魔」「祭り」の3段階を仮置きし、初期値は「邪魔」とする。「邪魔」では本文の中央も花火で隠れ、入力を止めると読める。「祭り」はEnter連打で画面の広い範囲が埋まる。\n負荷が高い端末では、花火1輪の細かい粒子数や解像度から落とす。輪の大きさ、最初の入力反応、大輪が開くタイミングはなるべく維持し、単に何も起きなくなる調整にしない。\n音は高音の発射、低めの開花、細かな残響を使い分ける。連打時も音量を加算し続けず、同時発音数と総音量を抑える。初回操作で音を開始できない環境でも、文字入力と画面演出はすぐ動く。\n## 保存と再開\nブラウザー内へ、本文と設定を作品固有の名前で保存する。編集直後に本文を確保し、保存処理の失敗がアニメーションや入力を止めないようにする。\niframeで保存領域を利用できない場合は、保存状態を短く表示し、テキスト書出しを使えるようにする。書出しファイルには花火の情報やHTMLを混ぜず、本文だけをUTF-8で入れる。\nページを開き直したときは本文を復元するが、復元した文字数を新しい入力として扱わない。長文の復元によって起動直後に花火が暴発することを避ける。\n## 技術構成案\n単独HTMLに標準の編集欄、Canvasの花火、音、保存処理を含める。本文と演出状態を別々に持ち、アニメーションのフレーム更新で編集欄の値を書き直さない。\n花火のレイヤーは編集欄の上に重ね、表示領域に収める。カーソルの位置が取得しにくい状況では、編集欄内の近い位置から打ち上げ、本文への入力を位置計算の成功待ちにしない。\nアニメーションは1本の更新ループで管理し、粒子、軌跡、発音に上限を設ける。通常のキーボード入力を落とさないことを優先し、演出負荷は計測しながら調整する。\n非表示になったiframeでは演出の更新と音を止め、再表示時に大量の花火を追い掛け再生しない。作品の外側にある記事本文の入力やキー操作には反応しない。\n## 記事への埋め込み\niframeの初期高さは560pxを目安にする。最初から入力欄が見え、クリックして文字を書けば試せる。モバイルではソフトウェアキーボードが出た状態でも、改行直後の大輪が見える位置へ収める。\n記事では「メモ帳です。Enterで改行できます。」程度の説明とともに置く。静止画だけでは入力との結び付きが伝わりにくいため、実物をその場で触れることを中心にする。\n## 完成条件\n入力直後の反応が分かり、短い文章とEnterだけで画面が十分騒がしくなる。通常入力とEnterの強さに明確な違いがあり、文字が隠れるほどの花火を実際に体験できる。\n日本語の変換確定で余分な改行やEnter用花火が発生せず、通常の編集、Undo／Redo、貼り付け、本文の復元、UTF-8書出しが動く。演出を止めた後に、入力した本文がそのまま残る。\n高速入力中もキー入力と本文保存を維持できる。花火を過剰に作って入力自体が止まる状態は、派手さが成立したとは扱わない。\n演出の密度、間、音の最終値は、初期の短い体験を見て相談して決める。この仕様書はその比較に必要な入力の種類と評価点までを定め、体験していない気持ちよさを確定済みとしない。\n"

<script>
(function () {
  'use strict';

  const TAU = Math.PI * 2;
  const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
  const random = (low, high) => low + Math.random() * (high - low);
  const PALETTES = [
    ['#fff2b2', '#ffcc48', '#ff7547'],
    ['#ffd4ef', '#ff6fbf', '#cf54ff'],
    ['#d9fff4', '#72ffd6', '#41bddb'],
    ['#fff9e0', '#ffe17a', '#e79443'],
    ['#d8e8ff', '#a2baff', '#9b6fff'],
    ['#fff1ce', '#ff9572', '#ff507e']
  ];
  const PROFILES = {
    lively: { particles: 55, radius: 0.27, maximum: 1300, shells: 1, finale: 5 },
    annoying: { particles: 88, radius: 0.38, maximum: 2200, shells: 2, finale: 7 },
    festival: { particles: 125, radius: 0.48, maximum: 3000, shells: 3, finale: 8 }
  };
  const COMBO_COLORS = ['#c861ff', '#ff963f', '#ff4fae', '#45e7ff'];
  const COMBO_WINDOW = 2.4;
  const SPECIAL_KEYS = new Set(['Insert', 'Home', 'PageUp', 'PageDown', 'End', 'Delete']);

  class FireworksSound {
    constructor() {
      this.context = null;
      this.master = null;
      this.compressor = null;
      this.noise = null;
      this.enabled = true;
      this.volume = 0.35;
      this.voices = new Set();
      this.lastTick = -Infinity;
      this.lastBoom = -Infinity;
      this.suspended = false;
    }

    unlock() {
      if (!this.enabled || this.suspended) return Promise.resolve(false);
      try {
        if (!this.context) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return Promise.resolve(false);
          this.context = new AudioContext();
          this.master = this.context.createGain();
          this.master.gain.value = this.volume * 0.62;
          this.compressor = this.context.createDynamicsCompressor();
          this.compressor.threshold.value = -17;
          this.compressor.knee.value = 12;
          this.compressor.ratio.value = 12;
          this.compressor.attack.value = 0.003;
          this.compressor.release.value = 0.18;
          this.master.connect(this.compressor);
          this.compressor.connect(this.context.destination);
          this.noise = this.context.createBuffer(1, this.context.sampleRate, this.context.sampleRate);
          const data = this.noise.getChannelData(0);
          let previous = 0;
          for (let i = 0; i < data.length; i += 1) {
            previous = (previous + random(-0.085, 0.085)) / 1.018;
            data[i] = previous * 4;
          }
        }
        if (this.context.state === 'running') return Promise.resolve(true);
        return this.context.resume().then(() => this.context.state === 'running').catch(() => false);
      } catch (_) {
        return Promise.resolve(false);
      }
    }

    setEnabled(enabled) {
      this.enabled = Boolean(enabled);
      if (!this.enabled) this.stop();
      this.updateGain();
    }

    setVolume(volume) {
      this.volume = clamp(Number(volume) || 0, 0, 1);
      this.updateGain();
    }

    updateGain() {
      if (!this.context || !this.master) return;
      const volume = this.enabled && !this.suspended ? this.volume * 0.62 : 0;
      try {
        const now = this.context.currentTime;
        this.master.gain.cancelScheduledValues(now);
        this.master.gain.setTargetAtTime(volume, now, 0.02);
      } catch (_) { /* Audio failure never interrupts editing. */ }
    }

    setSuspended(suspended) {
      this.suspended = Boolean(suspended);
      if (this.suspended) this.stop();
      this.updateGain();
    }

    ready() {
      return this.enabled && !this.suspended && this.volume > 0 && this.context &&
        this.context.state === 'running' && this.voices.size < 14;
    }

    voice(source, gain, nodes, duration) {
      const entry = { source, nodes: [source, gain, ...nodes] };
      this.voices.add(entry);
      source.onended = () => {
        this.voices.delete(entry);
        for (const node of entry.nodes) {
          try { node.disconnect(); } catch (_) { /* Already disconnected. */ }
        }
      };
      source.start();
      source.stop(this.context.currentTime + duration);
    }

    tick(large) {
      if (!this.ready()) return;
      const now = this.context.currentTime;
      if (now - this.lastTick < 0.042) return;
      this.lastTick = now;
      try {
        const oscillator = this.context.createOscillator();
        const gain = this.context.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(large ? 920 : random(1300, 2100), now);
        oscillator.frequency.exponentialRampToValueAtTime(large ? 1900 : 650, now + 0.085);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(large ? 0.13 : 0.065, now + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.105);
        oscillator.connect(gain);
        gain.connect(this.master);
        this.voice(oscillator, gain, [], 0.12);
      } catch (_) { /* Browser audio limits do not affect the canvas. */ }
    }

    boom(large) {
      if (!this.ready()) return;
      const now = this.context.currentTime;
      if (now - this.lastBoom < 0.052) return;
      this.lastBoom = now;
      try {
        const oscillator = this.context.createOscillator();
        const lowGain = this.context.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(large ? 112 : 150, now);
        oscillator.frequency.exponentialRampToValueAtTime(34, now + 0.32);
        lowGain.gain.setValueAtTime(0.0001, now);
        lowGain.gain.exponentialRampToValueAtTime(large ? 0.75 : 0.36, now + 0.008);
        lowGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.43);
        oscillator.connect(lowGain);
        lowGain.connect(this.master);
        this.voice(oscillator, lowGain, [], 0.46);

        if (this.voices.size >= 14) return;
        const noise = this.context.createBufferSource();
        const filter = this.context.createBiquadFilter();
        const gain = this.context.createGain();
        noise.buffer = this.noise;
        noise.playbackRate.value = random(0.85, 1.2);
        filter.type = 'bandpass';

        if (shell.style === 1) distance = i % 3 === 0 ? random(0.42, 0.53) : random(0.93, 1);
        if (shell.style === 2) distance = i % 5 === 0 ? random(0.4, 0.65) : random(0.82, 1);

          shell.targetX, shell.targetY,
          Math.cos(angle) * speed * distance,
          Math.sin(angle) * speed * distance * (golden ? 0.83 : 1),

    sprite(color) {

      const sprite = document.createElement('canvas');
      sprite.width = 32;
      sprite.height = 32;

      const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(0.12, color);
      gradient.addColorStop(0.35, color + '99');
      gradient.addColorStop(1, color + '00');

    clearCanvas() {

      context.shadowOffsetY = 0;

      context.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    tick(timestamp) {
      this.raf = 0;
      if (!this.canRun()) { this.clear(); return; }
      const now = timestamp / 1000;
      const elapsed = this.lastTime ? now - this.lastTime : 1 / 60;
      const dt = clamp(elapsed, 0.001, 0.042);
      this.lastTime = now;
      if (elapsed > 0.034 && elapsed < 0.2) {
        this.slowFrames += 1;
        this.goodFrames = 0;
        if (this.slowFrames >= 10 && this.quality > 0.48) {
          this.quality = Math.max(0.48, this.quality - 0.12);
          this.slowFrames = 0;
          if (this.quality < 0.65) this.resize();
        }
      } else if (elapsed < 0.022) {
        this.goodFrames += 1;
        this.slowFrames = Math.max(0, this.slowFrames - 1);
        if (this.goodFrames > 240) {
          this.quality = Math.min(1, this.quality + 0.06);
          this.goodFrames = 0;
        }
      }
      this.heat = Math.max(0, this.heat - dt * 0.3);
      for (let i = this.queue.length - 1; i >= 0; i -= 1) {
        if (this.queue[i].at <= now) {
          const shell = this.queue.splice(i, 1)[0];
          if (now - shell.at < 1.2) this.launch(shell, now);
        }
      }
      const context = this.context;
      this.clearCanvas();
      context.globalCompositeOperation = 'lighter';

      for (let i = this.rockets.length - 1; i >= 0; i -= 1) {
        const rocket = this.rockets[i];
        const progress = clamp((now - rocket.born) / rocket.duration, 0, 1);
        const ease = 1 - Math.pow(1 - progress, 1.6);
        const x = rocket.x + (rocket.targetX - rocket.x) * ease;
        const y = rocket.y + (rocket.targetY - rocket.y) * ease - Math.sin(progress * Math.PI) * 18;
        context.globalAlpha = 0.85;
        context.strokeStyle = rocket.palette[1];
        context.lineWidth = rocket.large ? 2.4 : 1.6;
        context.beginPath();
        context.moveTo(rocket.px, rocket.py);
        context.lineTo(x, y);
        context.stroke();
        context.drawImage(this.sprite(rocket.palette[0]), x - 8, y - 8, 16, 16);
        rocket.px = x;
        rocket.py = y;
        if (progress >= 1) {
          this.rockets.splice(i, 1);
          this.burst(rocket, now);
        }
      }

      for (let i = this.halos.length - 1; i >= 0; i -= 1) {
        const halo = this.halos[i];
        const progress = Math.max(0, (now - halo.born) / halo.life);
        if (progress >= 1) { this.halos.splice(i, 1); continue; }
        const radius = halo.radius * (halo.type === 'touch' ? 0.3 + progress : 0.22 + progress * 0.8);
        context.globalAlpha = (1 - progress) * (halo.type === 'touch' ? 0.55 : 0.22);
        const gradient = context.createRadialGradient(halo.x, halo.y, 0, halo.x, halo.y, radius);
        gradient.addColorStop(0, halo.color);
        gradient.addColorStop(0.22, halo.color + 'aa');
        gradient.addColorStop(1, halo.color + '00');
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(halo.x, halo.y, radius, 0, TAU);
        context.fill();
        context.globalAlpha = Math.pow(1 - progress, 2) * 0.65;
        context.lineWidth = halo.type === 'touch' ? 1.5 : 2;
        context.strokeStyle = halo.color;
        context.beginPath();
        context.arc(halo.x, halo.y, radius * 0.74, 0, TAU);
        context.stroke();
      }

      const currentCount = this.particles.length;
      const offspring = [];
      for (let i = currentCount - 1; i >= 0; i -= 1) {

    if (lastComposition && now - lastComposition.time < 150
      && (type === 'insertFromComposition' || type === 'insertCompositionText'
        || (after === lastComposition.after && event.data === lastComposition.data))) {
      return;
    }
    lastComposition = null;

    if (type === 'historyUndo' || type === 'historyRedo') return;
    const change = actualChange(before, after, range);
    if (wasPaste) {
      if (change.inserted) emitInput('paste', change.inserted);
      return;
    }
    if (type.startsWith('delete') || (!change.inserted && change.removed)) {
      if (change.removed) emitInput('delete', change.removed);
      return;
    }
    // A committed IME Enter does not insert a newline; only the actual text change can do so.
    if (change.inserted.includes('\n') || change.inserted.includes('\r')) {
      emitInput('newline', change.inserted);
    } else if (change.inserted) {
      emitInput('type', change.inserted);
    } else if (range && range.start !== range.end && typeof event.data === 'string'
      && type.startsWith('insert') && event.data) {
      emitInput('type', event.data);
    }
  });

  for (const button of document.querySelectorAll('#intensity-controls [data-intensity]')) {
    button.addEventListener('click', () => {
      if (!allowedIntensities.includes(button.dataset.intensity)) return;
      settings.intensity = button.dataset.intensity;
      applySettings();
      persistPreferences();
    });
  }

  if (soundToggle) soundToggle.addEventListener('click', () => {
    settings.sound = !settings.sound;
    applySettings();
    if (settings.sound) callEngine('unlockAudio');
    persistPreferences();
  });

  if (volumeControl) volumeControl.addEventListener('input', () => {
    const next = Number(volumeControl.value);
    settings.volume = Number.isFinite(next) ? Math.max(0, Math.min(1, next / 100)) : defaults.volume;
    volumeControl.setAttribute('aria-valuetext', `${Math.round(settings.volume * 100)}%`);
    volumeControl.style.setProperty('--volume', `${Math.round(settings.volume * 100)}%`);
    callEngine('setVolume', settings.volume);
    if (settings.sound) callEngine('unlockAudio');
    persistPreferences();
  });

  if (pauseToggle) pauseToggle.addEventListener('click', () => {
    settings.paused = !settings.paused;
    applySettings();
    if (settings.paused) callEngine('clear');
    persistPreferences();
  });

  if (exportButton) exportButton.addEventListener('click', () => {
    recordCurrentText();
    const date = new Date();
    const two = (number) => String(number).padStart(2, '0');
    const stamp = `${date.getFullYear()}${two(date.getMonth() + 1)}${two(date.getDate())}`
      + `-${two(date.getHours())}${two(date.getMinutes())}${two(date.getSeconds())}`;
    let url = null;
    try {
      const blob = new Blob([memo.value], { type: 'text/plain;charset=utf-8' });
      url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `花火メモ-${stamp}.txt`;
      anchor.hidden = true;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      exportButton.dataset.exported = 'true';
      window.setTimeout(() => { delete exportButton.dataset.exported; }, 1000);
    } catch (error) {
      console.error('The text file could not be exported.', error);
      if (editorStatus) editorStatus.textContent = '書出しを開始できませんでした。本文をコピーして保存できます。';
    } finally {
      if (url) window.setTimeout(() => URL.revokeObjectURL(url), 1500);
    }
  });

  const specSource = byId('spec-source');
  const specContent = byId('spec-content');
  if (specSource && specContent) {
    try {
      const original = JSON.parse(specSource.textContent);
      specContent.textContent = typeof original === 'string' ? original : specSource.textContent;
    } catch (_) {
      specContent.textContent = specSource.textContent;
    }
  }

  let specPreviousFocus = null;
  let backdropPointer = false;
  if (specButton && specDialog) specButton.addEventListener('click', () => {
    if (specDialog.open) return;
    specPreviousFocus = document.activeElement;
    flushComposition();
    specDialog.showModal();
    document.body.classList.add('spec-open');
    callEngine('setPaused', true);
    callEngine('clear');
    if (specClose) specClose.focus({ preventScroll: true });
  });
  if (specClose && specDialog) specClose.addEventListener('click', () => specDialog.close());
  if (specDialog) {
    const outsideDialog = (event) => {
      const rectangle = specDialog.getBoundingClientRect();
      return event.clientX < rectangle.left || event.clientX > rectangle.right
        || event.clientY < rectangle.top || event.clientY > rectangle.bottom;
    };
    specDialog.addEventListener('pointerdown', (event) => {
      backdropPointer = event.target === specDialog && outsideDialog(event);
    });
    specDialog.addEventListener('click', (event) => {
      if (backdropPointer && event.target === specDialog && outsideDialog(event)) specDialog.close();
      backdropPointer = false;
    });
    specDialog.addEventListener('close', () => {
      document.body.classList.remove('spec-open');
      callEngine('setPaused', settings.paused);
      if (specPreviousFocus && typeof specPreviousFocus.focus === 'function') {
        specPreviousFocus.focus({ preventScroll: true });
      }
      specPreviousFocus = null;
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      recordCurrentText();
      callEngine('clear');
    }
  });
  window.addEventListener('pagehide', () => {
    recordCurrentText();
    persistPreferences();
    callEngine('clear');
  });

  applySettings();
  persistText(memo.value);
  scheduleCharacterCount();
  // Diagnostics never rewrite the editor or synthesize input events.
  window.fireApp = Object.freeze({
    engine,
    getState: () => Object.freeze({
      text: memo.value,
      ...settings,
      saved: storageAvailable && lastSavedText === memo.value,
      composing,
      specOpen: Boolean(specDialog && specDialog.open),
      statistics: callEngine('getStats'),
    }),
  });
})();
</script>
</body>
</html>

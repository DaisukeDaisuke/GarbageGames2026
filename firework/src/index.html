<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b1014">
  <meta name="description" content="文字を入力。Enterで大花火。書くほど本文が見えなくなる、邪魔すぎる花火メモ帳。">
  <title>邪魔すぎる花火メモ帳 — Garbage 2026</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1014'/%3E%3Cg stroke='%23e9ff65' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M32 8v14m0 20v14M8 32h14m20 0h14M15 15l10 10m14 14 10 10M15 49l10-10m14-14 10-10'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='4' fill='%23ff7cba'/%3E%3C/svg%3E">

</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="masthead">
        <div class="wordmark" aria-label="Garbage 2026">
          <svg class="brand-spark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 1v8m0 14v8M1 16h8m14 0h8M5.4 5.4l5.7 5.7m9.8 9.8 5.7 5.7M5.4 26.6l5.7-5.7m9.8-9.8 5.7-5.7" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="2" fill="currentColor"/></svg>
          <span>GARBAGE<span class="wordmark-year">2026</span></span>
        </div>
        <span class="edition">NO. 04 <span>/</span> 書く、打ち上げる。</span>
      </div>
      <div class="hero">
        <div class="hero-title">
          <p class="eyebrow"><span></span> 生産性より、祝祭を。</p>
          <h1><span>邪魔すぎる</span><strong>花火メモ帳<span class="title-dot">。</span></strong></h1>
        </div>
        <div class="hero-aside">
          <svg class="hero-flower" viewBox="0 0 160 160" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="1.5">
              <path d="M80 4v47m0 58v47M4 80h47m58 0h47M26 26l34 34m40 40 34 34M26 134l34-34m40-40 34-34M51 10l18 44m22 52 18 44M10 51l44 18m52 22 44 18M10 109l44-18m52-22 44-18M51 150l18-44m22-52 18-44"/>
              <path d="M65 5l9 44m12 62 9 44M5 65l44 9m62 12 44 9M15 38l37 24m56 36 37 24M38 15l24 37m36 56 24 37M5 95l44-9m62-12 44-9M65 155l9-44m12-62 9-44M15 122l37-24m56-36 37-24M38 145l24-37m36-56 24-37" opacity=".4"/>
            </g><circle cx="80" cy="80" r="5" fill="currentColor"/>
          </svg>
          <p class="hero-copy">ちゃんと書ける。<br><span>たぶん、読めない。</span></p>
        </div>
      </div>
    </header>
    <main class="notebook" aria-label="花火メモ帳">
      <div class="notebook-top">
        <label class="paper-label" for="memo"><span class="paper-dot"></span> MEMO</label>
        <p class="input-hint" id="input-hint">文字を入力。<kbd>Enter ↵</kbd> で大花火。</p>
        <span class="editor-status" id="editor-status">打ち上げ待機中</span>
      </div>
      <div class="stage" id="stage">
        <div class="paper-margin" aria-hidden="true"><span>01</span><span>02</span><span>03</span><span>04</span><span>05</span><span>06</span><span>07</span><span>08</span><span>09</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span></div>
        <textarea id="memo" name="memo" aria-label="メモ本文" aria-describedby="input-hint" placeholder="ここに、今日のことを。&#10;Enterを押すと、だいたい見えません。" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="soft"></textarea>
        <canvas id="fireworks" aria-hidden="true"></canvas>
        <span class="stage-corner" aria-hidden="true">WRITE &amp; IGNITE</span>
      </div>
      <div class="toolbar" aria-label="メモ帳の設定と操作">
        <div class="intensity-setting">
          <span class="control-caption" id="intensity-label">花火</span>
          <div class="intensity-controls" id="intensity-controls" role="group" aria-labelledby="intensity-label">
            <button type="button" data-intensity="lively" aria-pressed="false"><span class="level-mark level-one" aria-hidden="true">✧</span>にぎやか</button>
            <button type="button" data-intensity="annoying" aria-pressed="true"><span class="level-mark" aria-hidden="true">✳</span>邪魔</button>
            <button type="button" data-intensity="festival" aria-pressed="false"><span class="level-mark" aria-hidden="true">✹</span>祭り</button>
          </div>
        </div>
        <div class="utility-controls">
          <div class="sound-setting">
            <button class="icon-text-button sound-button" type="button" id="sound-toggle" aria-pressed="true" aria-label="音をオフにする" title="音をオフにする">
              <svg class="sound-on-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m11 4-5 4H3v8h3l5 4V4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <svg class="sound-off-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m11 4-5 4H3v8h3l5 4V4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m16 9 6 6m0-6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span id="sound-label">音 ON</span>
            </button>
            <input type="range" id="volume" min="0" max="100" step="1" value="35" aria-label="音量" title="音量">
          </div>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button class="icon-text-button pause-button" type="button" id="pause-toggle" aria-pressed="false" aria-label="花火を一時停止する" title="花火を一時停止する">
            <svg class="pause-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            <svg class="play-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/></svg>
            <span id="pause-label">一時停止</span>
          </button>
          <button class="export-button" type="button" id="export-button" title="本文をUTF-8のテキストファイルで保存">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>.txt 保存</span>
          </button>
        </div>
      </div>
      <div class="notebook-bottom">
        <span class="save-state"><span class="save-light" aria-hidden="true"></span><span id="save-status" role="status" aria-live="polite">このブラウザーに自動保存</span></span>
        <span id="character-count" class="character-count">0 文字</span>
      </div>
    </main>
    <footer class="site-footer">
      <span>メモは残る。余韻も残る。</span>
      <button type="button" id="spec-button" class="spec-button" aria-haspopup="dialog">仕様書 <span aria-hidden="true">↗</span></button>
    </footer>
  </div>
  <dialog id="spec-dialog" class="spec-dialog" aria-labelledby="spec-heading">
    <div class="spec-header">
      <div><span class="dialog-eyebrow">THE ORIGINAL SPECIFICATION</span><h2 id="spec-heading">仕様書</h2></div>
      <button type="button" id="spec-close" class="spec-close" aria-label="仕様書を閉じる" autofocus>×</button>
    </div>
    <div class="spec-scroll"><pre id="spec-content"></pre></div>
  </dialog>
  <noscript><p class="noscript-notice">花火と自動保存を使うには、JavaScriptを有効にしてください。</p></noscript>

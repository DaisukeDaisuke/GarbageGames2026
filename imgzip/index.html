  .brand-mark { width:15px; height:15px; font-size:16px; }
  h1 { font-size:28px; letter-spacing:-2px; margin-top:7px; }
  .physical { letter-spacing:-1.4px; }
  .header-controls { gap:5px; }
  .icon-button,.sound-button { height:31px; border-radius:4px; }
  .icon-button { width:31px; }
  .sound-button { padding:0 7px; gap:4px; font-size:8px; }
  .icon-button svg,.sound-button svg { width:15px;height:15px; }
  .workbench { grid-template-columns:1fr; border-radius:8px; }
  .stage { height:250px; --floor:52px; }
  .stage-topline { top:10px; left:13px; right:13px; font-size:8px; }
  .top-beam { top:33px; height:31px; left:35px; right:35px; padding:0 10px; }
  .top-beam span { font-size:7px; letter-spacing:1.5px; }
  .column { top:64px; bottom:36px; width:23px; }
  .column-left { left:44px; }.column-right { right:44px; }
  .ram { top:64px; width:49px; margin-left:-24.5px; height:calc(100% - var(--plate-bottom) - 88px); }
  .moving-plate { height:25px; left:39px; right:39px; }
  .plate-vents { height:7px; margin-top:5px; }
  .moving-plate .bolt { top:4px; width:8px; height:8px; }
  .bottom-plate { bottom:32px; height:20px; left:26px;right:26px; }
  .hazard-stripe { height:11px; }
  .foot { height:6px; bottom:-6px; border-bottom-width:2px; }
  .stage-caption { bottom:8px; left:13px;right:13px; font-size:8px; }
  .pressure-meter { top:79px; left:10px; }
  .pressure-meter>span { font-size:6px; }
  .pressure-meter strong { font-size:12px; }
  .pressure-track { height:30px; }
  .ruler { right:12px; width:18px; }
  .ruler span { font-size:6px; }
  .target-line { left:70px;right:31px; }
  .target-line span { font-size:9px; top:-13px; }
  .hash-block { bottom:60px;left:65px;right:65px; }
  .hash-block code { font-size:10px;line-height:1.5;padding:6px 8px; }
  .hash-kicker { font-size:8px; margin-bottom:4px; }
  .impact-word { font-size:40px; }
  .control-panel { display:grid; grid-template-columns:minmax(0,1fr) 128px; gap:0 15px; padding:14px 15px 12px; border-left:0; border-top:1px solid var(--line); }
  .source-picker { grid-column:1 / -1; display:grid; grid-template-columns:auto 1fr; align-items:center; gap:5px 13px; border-bottom:1px solid var(--line);padding-bottom:10px; }
  .source-picker .section-label { display:none; }
  .file-controls { margin:0; gap:9px; }
  .choose-file { flex:none; padding:0 10px; height:29px; font-size:10px; }
  .choose-file svg { width:13px;height:13px; }
  .sample-button { font-size:8px; }
  .file-info { margin:0; font-size:8px; text-align:right; min-width:0; }
  .file-info span { max-width:100%; }
  .height-control { margin:0; padding:8px 0 0; border:0; }
  .section-label { font-size:9px; gap:5px; }
  .step-number { font-size:8px; }
  .height-display { margin:0; }
  .height-display output { font-size:38px; letter-spacing:-3px; }
  .height-display output span { font-size:17px; margin-left:3px; }
  .reduction-chip { font-size:7px; }
  .reduction-chip span { font-size:11px; }
  .height-slider { height:16px; margin-top:4px; }
  .height-slider::-webkit-slider-thumb { width:16px;height:22px;margin-top:-8px; }
  .range-labels { font-size:7px; }.range-labels i { font-size:7px; }
  .presets { margin-top:6px;gap:4px; }
  .presets button { font-size:8px; padding:4px 0; }
  .action-group { padding:0; align-self:center; margin-top:10px; }
  .press-button { font-size:14px; height:61px; padding:0 10px; gap:5px; letter-spacing:0; }
  .press-button-icon { font-size:23px; margin-right:2px; }
  .reset-button { font-size:9px; margin-top:13px; }
  .result-panel { position:relative;margin-top:10px;padding:10px 12px;grid-template-columns:minmax(0,1fr);grid-template-rows:10px 32px 32px;gap:4px;height:106px; }
  .result-heading { grid-row:1;flex-direction:row;align-items:center;justify-content:space-between;border-right:0; }
  .result-panel:not(.hash-result) .result-content { grid-row:2 / -1; }
  .result-heading .section-label { font-size:8px;letter-spacing:1px; }
  .result-badge { font-size:8px; }
  .result-content { grid-row:2;gap:7px; }
  .result-stat>span { font-size:12px; }
  .result-stat>small { font-size:8px; }
  .save-button { font-size:8px; padding:7px 8px;gap:4px;min-height:32px; }
  .save-button svg { width:12px;height:12px; }
  .hash-result .result-content { display:block; }
  .hash-result .result-stat { width:100%; }
  .hash-result .result-stat>span { font-size:11px; }
  .hash-details { grid-column:1;grid-row:3;display:block; }
  .hash-result .result-actions { position:absolute;right:12px;bottom:20px; }
  .hash-result .save-button { min-height:26px;padding:5px 7px; }
  .hash-controls { gap:6px; }
  .hash-controls select { font-size:9px;padding:3px;max-width:100px; }
  .hash-controls label { font-size:8px; }
  .copy-button { font-size:8px;padding:4px 5px; }
  #hash-budget { display:block;font-size:7px;line-height:1.4;margin-top:2px; }
  .footer { margin-top:9px;font-size:8px; }
  .footer>span { letter-spacing:1px; }
  .footer>div { gap:13px; }
  .footer button { font-size:8px; }
  .local-label { font-size:7px; }
}
@media(max-width:360px) { .app-surface { padding:12px 10px 9px; } h1 { font-size:26px; } .header-controls { gap:4px; }.sound-button { padding:0 5px; }.sound-button svg { display:none; }.control-panel { padding:12px 12px 11px;gap:0 12px;grid-template-columns:minmax(0,1fr) 113px; }.source-picker { gap:5px 8px; }.choose-file { padding:0 7px; }.file-controls { gap:6px; }.file-info { font-size:7px; }.press-button { padding:0 8px;font-size:13px; }.save-button svg { display:none; }.save-button { padding:7px 6px; }.range-labels i { display:none; } }
@media(prefers-reduced-motion:reduce) { button { transition:none; } }

</head>
<body>
  <div class="app" id="app">
    <div class="app-surface" id="app-surface">
      <header class="header">
        <div class="wordmark ink-target">
          <div class="eyebrow"><span class="brand-mark" aria-hidden="true">↓</span> GARBAGE 2026 <span class="edition">EXPERIMENT No.02</span></div>
          <h1>画像圧縮<span class="physical">（物理）</span><span class="title-dot" aria-hidden="true">。</span></h1>
        </div>
        <div class="header-controls">
          <button class="icon-button" id="motion-toggle" type="button" aria-pressed="false" aria-label="演出を軽減" title="演出を軽減">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 8 2 4-2 4M21 8l-2 4 2 4M8 5h8v14H8z"/></svg>
          </button>
          <button class="sound-button" id="sound-toggle" type="button" aria-pressed="true" aria-label="効果音をオフにする" title="効果音">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg>
            <span id="sound-label">音 ON</span>
          </button>
        </div>
      </header>

      <main>
        <div class="workbench">
          <section class="stage" id="stage" aria-label="画像をつぶす油圧プレス">
            <div class="stage-grid" aria-hidden="true"></div>
            <div class="stage-topline"><span class="live-state" id="live-state">READY</span><span class="model-number">HP-2026 / 01</span></div>
            <div class="press-frame" aria-hidden="true">
              <div class="top-beam"><i class="bolt"></i><span>HYDRAULIC IMAGE PRESS</span><i class="bolt"></i></div>
              <div class="column column-left"></div><div class="column column-right"></div>
              <div class="ram"></div>
              <div class="moving-plate"><span class="plate-vents"></span><i class="bolt"></i><i class="bolt"></i></div>
              <div class="bottom-plate"><div class="hazard-stripe"></div><div class="foot foot-left"></div><div class="foot foot-right"></div></div>
            </div>
            <div class="ruler" aria-hidden="true"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div>
            <div class="image-zone" id="image-zone"><img id="press-image" alt="プレス台の原画像" draggable="false"></div>
            <div class="target-line" id="target-line" aria-hidden="true"><span id="target-label">20%</span></div>
            <div class="hash-block" id="hash-block" hidden><span class="hash-kicker" id="hash-kicker">最終形態</span><code id="stage-hash"></code></div>
            <div class="impact-word" id="impact-word" aria-hidden="true"></div>
            <div class="pressure-meter" aria-hidden="true"><span>PRESSURE</span><strong id="pressure-value">00<span>%</span></strong><div class="pressure-track"><i id="pressure-fill"></i></div></div>
            <div class="stage-caption"><span><i class="status-led"></i> <span id="stage-caption">画像を圧縮できます。</span></span><span id="stage-ratio">100%</span></div>
            <div class="drop-overlay" id="drop-overlay" hidden><span>ここに投入 ↓</span></div>
          </section>

          <aside class="control-panel" aria-label="プレス操作">
            <div class="source-picker">
              <div class="section-label"><span class="step-number">01</span> 画像を投入</div>
              <div class="file-controls"><button class="choose-file" id="choose-file" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></svg><span>画像を選ぶ</span></button><button class="sample-button" id="sample-button" type="button" title="内蔵サンプルに戻す" aria-label="内蔵サンプルに戻す">サンプル</button></div>
              <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" hidden>
              <p class="file-info"><span id="source-name">サンプルを準備中</span><span id="source-detail">PNG / JPEG / WebP · 最大20MB</span></p>
            </div>

            <div class="height-control ink-target">
              <label class="section-label" for="height-slider"><span class="step-number">02</span> 残りの高さ</label>
              <div class="height-display"><output id="height-value" for="height-slider">20<span>%</span></output><div class="reduction-chip">高さ<span id="reduction-value">−80%</span></div></div>
              <input id="height-slider" class="height-slider" type="range" min="1" max="100" value="20" aria-label="残りの高さ" aria-valuetext="残り20パーセント">
              <div class="range-labels"><span>100% <i>やさしく</i></span><span><i>力ずく</i> 1%</span></div>
              <div class="presets" aria-label="残りの高さのプリセット"><button type="button" data-height="75">75%</button><button type="button" data-height="50">50%</button><button type="button" data-height="25">25%</button><button type="button" data-height="10">10%</button></div>
            </div>

            <div class="action-group ink-target">
              <button class="press-button" id="press-button" type="button" disabled><span class="press-button-label" id="press-button-label">圧縮する</span><span class="press-button-icon" aria-hidden="true">↓↓</span></button>
              <button class="reset-button" id="reset-button" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 9a7 7 0 1 1 1 5M3 3v6h6"/></svg>元に戻す</button>
            </div>
          </aside>
        </div>

        <section class="result-panel ink-target" id="result-panel" aria-label="圧縮結果">
          <div class="result-heading"><span class="section-label">OUTPUT</span><span class="result-badge" id="result-badge">プレス待ち</span></div>
          <div class="result-content" id="result-content">
            <div class="result-stat"><span id="result-main">準備中…</span><small id="result-detail">画像を読み込んでいます</small></div>
            <div class="result-actions"><button class="save-button" id="save-button" type="button" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg><span id="save-label">PNGを保存</span></button></div>
          </div>
          <div class="hash-details" id="hash-details" hidden>
            <div class="hash-controls"><label for="hash-method">方式</label><select id="hash-method"><option value="xxhash128">xxHash128</option><option value="xxhash64">xxHash64</option><option value="md5">MD5</option><option value="crc32">CRC32</option></select><button type="button" class="copy-button" id="copy-button">コピー</button></div><span id="hash-budget"></span>
          </div>
        </section>
        <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>
        <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
      </main>
      <footer class="footer"><span>力こそ、圧縮。</span><div><span class="local-label"><i></i> 端末内で処理</span><button id="spec-button" type="button">仕様書 <span aria-hidden="true">↗</span></button></div></footer>
    </div>
    <div class="effects" id="effects" aria-hidden="true"></div>
  </div>
  <dialog id="spec-dialog" class="spec-dialog" aria-labelledby="spec-title"><div class="spec-topbar"><h2 id="spec-title">仕様書</h2><button type="button" id="spec-close" aria-label="仕様書を閉じる">×</button></div><pre id="spec-text"></pre></dialog>
  <noscript><p class="noscript">このアプリを動かすにはJavaScriptを有効にしてください。</p></noscript>

  <script id="spec-source" type="application/json">"# 画像圧縮 物理 企画仕様書\n版：改訂0.2／2026年10月21日\n位置付け：「クソアプリ2026」の記事内iframeで遊ぶ画像変形アプリ。プレス、画面振動、飛び散るインク、最後のハッシュ化までを一続きの演出にする。\n## 企画の核\n油圧プレスで画像を縦につぶす。押すほど機械と画面が騒がしくなり、最後には画像だったものが短いハッシュ文字列になる。ドパガキ要素は、圧力の段階に合わせて増える振動、効果音、UIへ飛び散るインクに集約する。\n高さが残っている間は、実際につぶれた縦横比のPNGを持ち帰れる。残り10％以下では、実際に計算したハッシュを持ち帰れる。プレビューの飾りだけで終わらせない。\n## 数値の意味\nスライダーの名前は「残りの高さ」とし、100％から1％まで動かせる。数値rが小さいほど強く押しつぶす。今回の「50％以下」「25％以下」「10％以下」は、すべて原画像に対する残りの高さを指す。\n初期値は20％。これなら最初の1回で、画像の変形、振動、インクまで体験できる。10％以下へ動かすとさらに別の結果になることは、遊んで発見できるようにする。\n「残り20％」と「高さ80％削減」は併記してよいが、削減率を同じスライダー値として扱わない。PNGのファイル容量が80％減るという意味にはしない。\n## 画面と操作\n|部品|内容|\n|---|---|\n|プレス台|上下の金属板、支柱、接地した画像、残りの高さの目盛り|\n|画像選択|ファイル選択、ドロップ、内蔵サンプルへ戻す|\n|残りの高さ|100〜1％、初期値20％。スライダー中は目標位置だけを表示|\n|圧縮する|原画像からプレスを開始する|\n|元に戻す|原画像に戻し、振動、インク、ハッシュ表示を消す|\n|音|効果音のオン・オフ。初回のユーザー操作後から再生|\n|保存|PNG段階は「PNGを保存」、ハッシュ段階は「ハッシュを保存」|\n|結果|実際の寸法、実際の保存容量。ハッシュ時は方式、文字数、バイト数|\n起動時から、顔、丸い物、目盛りが入った内蔵サンプルをプレス台に置く。外部サイトへのアクセスや画像の準備を必要としない。\n## 圧力による段階\n|実行中の残り高さr|変形と演出|確定結果|\n|---|---|---|\n|100％〜50％超|上板が接触して、画像が縦につぶれる|変形後PNG|\n|50％以下〜25％超|iframe内のアプリ画面が振動する。きしみ音が強くなる|変形後PNG|\n|25％以下〜10％超|振動に加え、画像からインクが飛び、周囲のUIへランダムに付着する|変形後PNG|\n|10％以下|前段の演出を経て画像が文字へ崩れ、プレス台にハッシュ文字列が残る|ハッシュのテキスト|\n境界は50％、25％、10％を含む。演出の判定にはアニメーション中の実際のrを使う。1回のプレス中に境界を上から下へ通過したとき、それぞれ1回だけ発火する。最終指定が5％でも、50％の振動、25％のインク、10％のハッシュ化の順を通る。\n再実行は原画像の100％から始める。スライダーを動かしただけではインクを放出しない。アプリの外にある記事本文や別のiframeは揺らさない。\n## プレスとドパガキ演出\n全体は約1.6秒を初期案とする。接触まで0.25秒、押し込み1秒、停止の沈み込み0.35秒。ハッシュ計算が間に合わない場合だけ、終端でプレス音を弱めて待ち、偽のハッシュは表示しない。\n下端は台に接地させ、上端が板に押されて下がる。50％以下では画面の変位を最大2pxから6pxへ強める。揺れはCSSの見た目だけへ適用し、ボタンの配置計算や保存画像の画素には影響させない。\n25％以下で、原画像から採った数色のインクを8〜16滴飛ばす。飛び先はアプリ内のタイトル、スライダー、結果枠、ボタン周辺の実際の矩形から乱数で選ぶ。画面上の同じ場所へ毎回固定で出すことはしない。\nインクは0.2秒程度で飛んで付着し、0.6秒ほど残り、その後1.4秒でフェードアウトする。UIの手前に専用レイヤーを置き、pointer-eventsは無効にする。クリックを遮らず、文字が一時的に汚れて見えることを笑いにする。粒子の同時上限は24個とする。\n10％以下では画素が押し出されて英数字へ変わり、最後に本物のハッシュがプレス台に落ちる。画像の色や形が残ったサムネイルを、ハッシュ化後も結果として表示し続けない。原画像は内部に保持し、「元に戻す」ですぐ戻せる。\n音はモーター、きしみ、インクの破裂、短い金属音の4種類を用意する。音を切っても、段階的に壊れていく見た目で成立する。演出軽減時は揺れを小さくし、インクの付着と文字への変化で同じ結果を示す。\n## PNG段階の画素変換\n原画像の処理寸法をW×H、残りの高さをr％とする。rが10より大きい場合、出力幅はW、出力高さはmax(1, round(H × r / 100))。画像全体を縦縮小する。\n|原寸法|残りの高さ|確定結果|\n|---|---|---|\n|800×600|100％|800×600のPNG|\n|800×600|50％|800×300のPNG、振動あり|\n|800×600|25％|800×150のPNG、振動とインクあり|\n|800×600|20％|800×120のPNG|\n|800×600|11％|800×66のPNG|\n|800×600|10％|画像寸法のないハッシュ文字列|\n画素が1px未満になる場合は1pxで止め、表示には実際の整数寸法を使う。プレビュー倍率と書出し画素は分け、表示側で縦横比を戻さない。透明部分は保持する。\n保存PNGにプレス機、インク、火花、結果ラベルを焼き込まない。ファイル容量は生成したBlobの実測値を使い、元より大きくなった場合もその値を出す。\n## ハッシュ段階の仕様\n依存ライブラリはWebAssembly実装のhash-wasmを使う。「hash-webassembly」という呼び方で挙がった要望を、この依存先で具体化する。採用方式はCRC32、MD5、xxHash64、xxHash128。SHA系は今回の採用対象に含めない。\n入力は、読み込み時に保持した原画像ファイルの全バイト列とする。変形後Canvasを再保存したバイト列や、ファイル名は入力にしない。同じ原画像と同じ方式なら、プレスの演出が変わっても同じ結果になる。\n元の大きさは原ファイルのバイト数Bと定義する。ハッシュの保存形式は小文字16進数のUTF-8テキストとし、1文字を1Bとして長さを数える。画像の縦横の画素数を、ファイルのバイト数と混ぜない。\nrが10以下のとき、出力の文字数上限Lをmax(8, floor(B × r / 100))にする。最小のCRC32でも8文字必要なため、式の結果が8未満なら「最小8Bに到達」と明示する。ハッシュを途中で切って帳尻を合わせない。\n|方式|元のハッシュ幅|16進数での出力長|選択できる上限|\n|---|---|---|---|\n|CRC32|32bit|8文字＝8B|Lが8以上|\n|xxHash64|64bit|16文字＝16B|Lが16以上|\n|MD5|128bit|32文字＝32B|Lが32以上|\n|xxHash128|128bit|32文字＝32B|Lが32以上|\n自動選択では、Lが32以上ならxxHash128、16以上32未満ならxxHash64、8以上16未満ならCRC32を選ぶ。結果の方式欄から、上限に収まる他方式へ変更できる。MD5は32文字を選べる場合の選択肢とする。\n例えば原ファイルB=200B、残り10％ならL=20なのでxxHash64の16文字になる。B=1,000B、残り10％ならL=100なのでxxHash128の32文字になる。上限を埋めるためにハッシュを連結したり、ゼロを足したりしない。\nCRC32はライブラリ既定の多項式を使い、xxHash64とxxHash128のseedは0で固定する。使用した方式、入力B、L、実際の文字数を結果へ表示する。方式ごとの再計算結果を原画像単位でキャッシュし、スライダー操作のたびに全ファイルを再ハッシュしない。\n保存内容はハッシュ文字列だけとし、BOM、末尾改行、方式名を含めない。方式名はファイル名へ入れる。例はphoto-physical-r10-xxhash128.txt。結果画面のコピーも同じ文字列をコピーする。\n採用APIの確認先：[hash-wasm公式リポジトリ](https://github.com/Daninet/hash-wasm)。2026年10月21日にcrc32、md5、xxhash64、xxhash128の対応を確認。実装時は採用バージョンを固定し、必要な方式だけを配布物へ含める。\n## 状態と連続操作\n|状態|できること|次の状態|\n|---|---|---|\n|準備完了|画像変更、率の調整、圧縮開始|実行中|\n|実行中|音切替、元に戻す|PNG完了、ハッシュ計算待ち、準備完了|\n|ハッシュ計算待ち|音切替、元に戻す|ハッシュ完了またはエラー|\n|PNG完了|PNG保存、再圧縮、画像変更、元に戻す|実行中または準備完了|\n|ハッシュ完了|テキスト保存、コピー、方式変更、再圧縮、元に戻す|実行中または準備完了|\n再圧縮は常に原画像から計算する。開始ボタン連打で処理を重複させない。画像変更とリセットで世代IDを更新し、古いハッシュ計算やアニメーションの完了通知を無効にする。\nリセットでは振動を止め、インク、文字の残骸、保存可能な古い結果を消す。原画像を読み込み直す必要はない。計算失敗時は原画像を保持し、理由と再試行操作を表示する。確定していない結果は保存させない。\n## 入力と技術構成\n初版はPNG、JPEG、WebPの静止画。入力上限は20MBかつ展開後1600万画素の案とし、超えた場合はその画像を受け付けず理由を表示する。無断で縮小した画像を原ファイルとしてハッシュしない。\n画像の向きは表示時に正しくそろえる。PNG出力は向きを反映した画素を使い、ハッシュ入力は向きの補正前の原ファイルバイト列を保持する。ファイル全体のハッシュであることを実装上統一する。\n内蔵サンプルは固定PNGのバイト列とする。プレビュー、画像出力、ハッシュのいずれも同じ原本を使う。ファイルをブラウザー外へ送らない。\n単独HTMLにCSS、JavaScript、サンプル、必要なWASMを含める構成を第一案とする。プレスはSVGまたはCSS、画像の書出しはCanvas、粒子はCanvasまたはDOMレイヤーで実装する。重いハッシュ処理はWeb Workerで実行し、UIの振動やリセットを止めない。\n## 記事への埋め込み\niframeの初期高さは680px、最小幅は320px。主要操作とプレス台を同時に見せ、画像がつぶれてもアプリ全体の高さは変えない。振動とインクはiframe内部にクリップする。\n記事には「画像を圧縮できます。」という短い紹介と実物を置く。10％でのオチを押す前の説明で言い切らない。埋め込み内のファイル選択、保存、WASMの起動まで確認する。\n## 完成条件\n50％ちょうどで振動、25％ちょうどでインク、10％ちょうどでハッシュへ移行する。各境界を1％上回る場合には、その段階の演出がまだ始まらない。小さいrまで押す場合も段階を順に通る。\n800×600、残り20％の保存結果は800×120のPNG。残り10％ではPNGを生成せず、選択した方式の正しいハッシュ文字列を保存する。表示バイト数と保存ファイルのバイト数が一致する。\n原ファイルBとrから上限Lが決まり、上限を超える方式は選べない。8B下限は明示する。SHA系へのフォールバックを入れない。同一入力、方式、seedで結果が一致する。\nインクは周囲のUIの複数箇所へランダムに付き、時間で消える。連打、途中リセット、画像変更、計算失敗でも、古い画像の結果や粒子が新しい画像に混ざらない。\n"</script>

(() => {
  "use strict";

  const MAX_BYTES = 20_000_000;
  const MAX_PIXELS = 16_000_000;
  const HASH_LENGTHS = Object.freeze({ crc32: 8, xxhash64: 16, md5: 32, xxhash128: 32 });
  const abortError = () => new DOMException("操作が取り消されました。", "AbortError");
  const fail = (message) => { throw new Error(message); };
  const ascii = (bytes, offset, size) => String.fromCharCode(...bytes.subarray(offset, offset + size));

  function checkDimensions(width, height) {
    if (!Number.isInteger(width) || !Number.isInteger(height) || width < 1 || height < 1) {
      fail("画像の大きさを読み取れませんでした。");
    }
    if (width * height > MAX_PIXELS) fail("1600万画素を超える画像です。小さい画像を選んでください。");
    return { width, height };
  }

  function inspectImage(bytes) {
    const size = bytes.byteLength;
    const view = new DataView(bytes.buffer, bytes.byteOffset, size);
    if (size >= 24 && bytes[0] === 137 && ascii(bytes, 1, 7) === "PNG\r\n\x1a\n") {
      if (ascii(bytes, 12, 4) !== "IHDR") fail("PNGのヘッダーが壊れています。");
      const dimensions = checkDimensions(view.getUint32(16), view.getUint32(20));
      let offset = 8;
      while (offset + 12 <= size) {
        const length = view.getUint32(offset);
        const kind = ascii(bytes, offset + 4, 4);
        if (offset + length + 12 > size) fail("PNGファイルの一部が欠けています。");
        if (kind === "acTL") fail("アニメーションPNGには対応していません。静止画を選んでください。");
        offset += length + 12;
        if (kind === "IEND") break;
      }
      return { mime: "image/png", ...dimensions };
    }
    if (size >= 4 && bytes[0] === 255 && bytes[1] === 216) {
      let offset = 2;
      while (offset + 3 < size) {
        if (bytes[offset] !== 255) fail("JPEGのヘッダーを読み取れませんでした。");
        while (bytes[offset] === 255 && offset < size) offset += 1;
        const marker = bytes[offset++];
        if (marker === 217 || marker === 218) break;
        if (marker === 1 || (marker >= 208 && marker <= 215)) continue;
        if (offset + 2 > size) break;
        const length = view.getUint16(offset);
        if (length < 2 || offset + length > size) fail("JPEGファイルの一部が欠けています。");
        const isFrame = marker >= 192 && marker <= 207 && marker !== 196 && marker !== 200 && marker !== 204;
        if (isFrame && length >= 7) {
          return { mime: "image/jpeg", ...checkDimensions(view.getUint16(offset + 5), view.getUint16(offset + 3)) };
        }
        offset += length;
      }
      fail("このJPEGの画像サイズを読み取れませんでした。");
    }
    if (size >= 20 && ascii(bytes, 0, 4) === "RIFF" && ascii(bytes, 8, 4) === "WEBP") {
      const declaredSize = view.getUint32(4, true) + 8;
      if (declaredSize > size) fail("WebPファイルの一部が欠けています。");
      let dimensions = null;
      let offset = 12;
      while (offset + 8 <= declaredSize) {
        const kind = ascii(bytes, offset, 4);
        const length = view.getUint32(offset + 4, true);
        const start = offset + 8;
        if (start + length > declaredSize) fail("WebPファイルの一部が欠けています。");
        if (kind === "ANIM" || kind === "ANMF" || (kind === "VP8X" && length >= 10 && (bytes[start] & 2))) {
          fail("アニメーションWebPには対応していません。静止画を選んでください。");
        }
        if (kind === "VP8X" && length >= 10) {
          const width = 1 + bytes[start + 4] + (bytes[start + 5] << 8) + (bytes[start + 6] << 16);
          const height = 1 + bytes[start + 7] + (bytes[start + 8] << 8) + (bytes[start + 9] << 16);
          dimensions = checkDimensions(width, height);
        } else if (!dimensions && kind === "VP8 " && length >= 10 && bytes[start + 3] === 157 && bytes[start + 4] === 1 && bytes[start + 5] === 42) {
          dimensions = checkDimensions(view.getUint16(start + 6, true) & 16383, view.getUint16(start + 8, true) & 16383);
        } else if (!dimensions && kind === "VP8L" && length >= 5 && bytes[start] === 47) {
          const width = 1 + bytes[start + 1] + ((bytes[start + 2] & 63) << 8);
          const height = 1 + (bytes[start + 2] >> 6) + (bytes[start + 3] << 2) + ((bytes[start + 4] & 15) << 10);
          dimensions = checkDimensions(width, height);
        }
        offset = start + length + (length % 2);
      }
      if (!dimensions) fail("このWebPの画像サイズを読み取れませんでした。");
      return { mime: "image/webp", ...dimensions };
    }
    fail("PNG・JPEG・WebPの静止画を選んでください。");
  }

  async function decodeImage(blob, objectUrl) {

      drop.style.setProperty("--color", source.colors[i % source.colors.length]);
      drop.style.setProperty("--size", `${11 + Math.random() * 20}px`);
      drop.style.setProperty("--dx", `${x - origin.x}px`);
      drop.style.setProperty("--dy", `${y - origin.y}px`);
      drop.style.setProperty("--turn", `${Math.random() * 360}deg`);
      appendParticle(drop);
    }
  }
  function letters() {
    const origin = particleOrigin();
    const glyphs = "0a1b2c3d4e5f";
    for (let i = 0; i < 8; i++) {
      const fragment = document.createElement("i");
      fragment.className = "particle glyph-particle";
      const letter = document.createElement("span");
      letter.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      fragment.appendChild(letter);
      fragment.style.left = `${origin.x + (Math.random() - 0.5) * 80}px`;
      fragment.style.top = `${origin.y}px`;
      fragment.style.setProperty("--color", source.colors[i % source.colors.length]);
      fragment.style.setProperty("--dx", `${(Math.random() - 0.5) * 160}px`);
      fragment.style.setProperty("--dy", `${25 + Math.random() * 35}px`);
      fragment.style.setProperty("--turn", `${(Math.random() - 0.5) * 80}deg`);
      appendParticle(fragment);
    }
  }
  function shake(r, decay = 1) {
    if (r > 50) return;
    const amplitude = (reduced ? 0.35 : 2 + (50 - r) / 49 * 4) * decay;
    ui.surface.style.setProperty("--shake-x", `${(Math.random() * 2 - 1) * amplitude}px`);
    ui.surface.style.setProperty("--shake-y", `${(Math.random() * 2 - 1) * amplitude}px`);
  }
  function finishPNG(result, r) {
    output = { kind: "png", ...result, r };
    setHeight(result.height / source.height * 100, 0);
    ui.result.classList.add("complete");
    ui.badge.textContent = `残り ${r}%`;
    ui.main.textContent = `${exact(result.width)} × ${exact(result.height)} px`;
    ui.detail.textContent = `PNG · ${PhysicalEngine.formatBytes(result.blob.size)}（${exact(result.blob.size)} B）`;
    ui.caption.textContent = r === 100 ? "原寸でプレス完了。" : "しっかり、ぺちゃんこ。";
    ui.state.textContent = "COMPRESSED";
    ui.stage.classList.add("has-result");
    setState("png");
    announce(`圧縮完了。${result.width}×${result.height}ピクセル、${result.blob.size}バイトのPNGを保存できます。`);
  }
  function finishHash(digest, algorithm, r, limits) {
    const blob = new Blob([digest], { type: "text/plain;charset=utf-8" });
    output = { kind: "hash", blob, digest, algorithm, r, limits };
    ui.stage.classList.add("hash-mode", "has-result");
    ui.hashBlock.hidden = false;
    ui.hashKicker.textContent = "これが、最終形態。";
    ui.stageHash.textContent = digest;
    ui.result.classList.add("complete", "hash-result");
    ui.badge.textContent = "圧縮の、その先";
    ui.main.textContent = digest;
    ui.detail.textContent = `${names[algorithm]} · ${digest.length}文字 = ${blob.size} B · 画像寸法なし`;
    ui.saveLabel.textContent = "ハッシュを保存";
    ui.hashDetails.hidden = false;
    for (const option of ui.method.options) option.disabled = !limits.allowed.includes(option.value);
    ui.method.value = algorithm;
    ui.budget.textContent = `入力 ${exact(source.bytes)} B / 上限 L=${exact(limits.limit)}文字${limits.minimum ? " / 最小8Bに到達" : ""}`;
    ui.caption.textContent = "画像だったものです。";
    ui.state.textContent = "LIMIT BREAK";
    setState("hash");
    announce(`${names[algorithm]}への変換完了。${digest.length}文字、${blob.size}バイト。`);
  }
  function failure(error) {
    stopVisuals();
    ready();
    ui.pressLabel.textContent = "再試行";
    notice(`${error.message || "計算に失敗しました。"} 「再試行」でやり直せます。`);
  }
  async function press() {
    if (busy() || !source) return;
    const ticket = ++revision;
    stopVisuals();
    engine.invalidate();
    notice("");
    clearResult();
    const target = Number(ui.slider.value);
    const limits = target <= 10 ? PhysicalEngine.limitsFor(source.bytes, target) : null;
    const algorithm = limits ? limits.automatic : null;
    setHeight(100, window.innerWidth <= 600 ? 14 : 18);
    setState("running");
    ui.pressLabel.textContent = "接触中…";
    ui.state.textContent = "PRESSING";
    ui.caption.textContent = "加圧中";
    audio.start();
    const calculation = (limits ? engine.hash(algorithm) : engine.makePNG(target)).then(
      (value) => ({ value }), (error) => ({ error })
    );
    const start = performance.now();
    const initialGap = plateGap;
    const crossed = new Set();
    let previous = 100;
    function crossThresholds(r) {
      for (const boundary of [50, 25, 10]) {
        if (previous > boundary && r <= boundary && !crossed.has(boundary)) {
          crossed.add(boundary);
          if (boundary === 50) {
            impact("ミシッ。");
            audio.creak();
            ui.pressLabel.textContent = "加圧中…";
          } else if (boundary === 25) {
            impact("ブシャッ！");
            ink();
            audio.pop();
          } else {
            letters();
            ui.stage.classList.add("hash-mode");
            ui.hashBlock.hidden = false;
            ui.hashKicker.textContent = "もはや、画像ではない。";
            ui.stageHash.textContent = "計算中…";
            impact("限界突破");
            audio.metal();
          }
        }
      }
      previous = r;
    }
    function frame(now) {
      if (ticket !== revision) return;
      const elapsed = now - start;
      if (elapsed < 250) {
        const t = elapsed / 250;
        setHeight(100, initialGap * Math.pow(1 - t, 3));
      } else {
        const t = Math.min(1, (elapsed - 250) / 1000);
        const smooth = t * t * (3 - 2 * t);
        const r = t === 1 ? target : 100 + (target - 100) * smooth;
        setHeight(r, 0);
        crossThresholds(r);
        audio.pressure(r);
        if (elapsed < 1250) {
          ui.pressLabel.textContent = "加圧中…";
          shake(r);
        } else {
          const settle = Math.min(1, (elapsed - 1250) / 350);
          shake(r, 1 - settle);
          const dip = (reduced ? 0.3 : 2) * Math.sin(settle * Math.PI) * (1 - settle);
          document.querySelector(".moving-plate").style.transform = `translateY(${dip}px)`;
        }
      }
      if (elapsed < 1600) animation = requestAnimationFrame(frame);
      else finalize();
    }
    async function finalize() {
      animation = 0;
      audio.stop();
      ui.surface.style.removeProperty("--shake-x");
      ui.surface.style.removeProperty("--shake-y");
      document.querySelector(".moving-plate").style.removeProperty("transform");
      setState("waiting");
      const result = await calculation;
      if (ticket !== revision) return;
      if (result.error) { if (result.error.name !== "AbortError") failure(result.error); return; }
      if (limits) finishHash(result.value, algorithm, target, limits);
      else { finishPNG(result.value, target); audio.metal(); }
    }
    animation = requestAnimationFrame(frame);
  }
  async function changeMethod() {
    if (state !== "hash" || !output) return;
    const prior = output;
    const algorithm = ui.method.value;
    if (!prior.limits.allowed.includes(algorithm) || prior.algorithm === algorithm) return;
    const ticket = ++revision;
    output = null;
    clearTimeout(copyTimer);
    ui.copy.textContent = "コピー";
    ui.main.textContent = "計算中…";
    ui.stageHash.textContent = "計算中…";
    ui.detail.textContent = `${names[algorithm]}を計算しています`;
    setState("waiting");
    notice("");
    try {
      const digest = await engine.hash(algorithm);
      if (ticket === revision) finishHash(digest, algorithm, prior.r, prior.limits);
    } catch (error) { if (ticket === revision && error.name !== "AbortError") failure(error); }
  }
  function save() {
    if (!output || (state !== "png" && state !== "hash")) return;
    const stem = source.name.replace(/\.[^.]*$/, "").replace(/[<>:"/\\|?*\u0000-\u001f]/g, "_").slice(0, 96) || "image";
    const suffix = output.kind === "hash" ? `-${output.algorithm}.txt` : ".png";
    PhysicalEngine.saveBlob(output.blob, `${stem}-physical-r${output.r}${suffix}`);
    announce("保存ファイルを作成しました。");
  }
  async function copyHash() {
    if (state !== "hash" || !output) return;
    const digest = output.digest;
    const ticket = revision;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(digest); }
        catch (_) { if (ticket !== revision) return; legacyCopy(digest); }
      } else legacyCopy(digest);
      if (ticket !== revision) return;
      ui.copy.textContent = "コピー済";
      announce("ハッシュをコピーしました。");
      copyTimer = setTimeout(() => { if (ticket === revision) ui.copy.textContent = "コピー"; }, 2200);
    } catch (_) { if (ticket === revision) notice("コピーできませんでした。結果の文字列を選択してコピーするか、ハッシュを保存してください。"); }
  }
  function legacyCopy(text) {
    const field = document.createElement("textarea");
    field.value = text;
    field.style.cssText = "position:fixed;left:0;top:0;width:1px;height:1px;opacity:0";
    field.setAttribute("readonly", "");
    document.body.appendChild(field);
    field.select();
    let copied = false;
    try { copied = document.execCommand("copy"); }
    finally { field.remove(); ui.copy.focus(); }
    if (!copied) throw new Error("copy");
  }
  function updateMotion() {
    ui.app.classList.toggle("reduced", reduced);
    ui.motion.setAttribute("aria-pressed", String(reduced));
    ui.motion.setAttribute("aria-label", reduced ? "通常の演出にする" : "演出を軽減");
    ui.motion.title = reduced ? "通常の演出にする" : "演出を軽減";
  }

  ui.slider.addEventListener("input", () => setTarget(Number(ui.slider.value)));
  presets.forEach((button) => button.addEventListener("click", () => setTarget(Number(button.dataset.height))));
  ui.press.addEventListener("click", press);
  ui.reset.addEventListener("click", reset);
  ui.choose.addEventListener("click", () => ui.input.click());
  ui.input.addEventListener("change", () => loadFile(ui.input.files[0]));
  ui.sample.addEventListener("click", () => { setTarget(20); loadFile(sampleFile()); });
  ui.save.addEventListener("click", save);
  ui.method.addEventListener("change", changeMethod);
  ui.copy.addEventListener("click", copyHash);
  ui.motion.addEventListener("click", () => { reduced = !reduced; updateMotion(); });
  media.addEventListener("change", (event) => { reduced = event.matches; updateMotion(); });
  ui.sound.addEventListener("click", () => {
    soundEnabled = !soundEnabled;
    ui.sound.setAttribute("aria-pressed", String(soundEnabled));
    ui.sound.setAttribute("aria-label", soundEnabled ? "効果音をオフにする" : "効果音をオンにする");
    ui.soundLabel.textContent = soundEnabled ? "音 ON" : "音 OFF";
    audio.mute();
    if (soundEnabled) {
      audio.unlock();
      if (state === "running") audio.start();
    }
  });
  for (const type of ["dragenter", "dragover", "dragleave", "drop"]) {
    document.addEventListener(type, (event) => {
      if (!event.dataTransfer || !Array.from(event.dataTransfer.types).includes("Files")) return;
      event.preventDefault();
      if (type === "dragover") event.dataTransfer.dropEffect = busy() ? "none" : "copy";
      if (type === "dragenter") { dragDepth += 1; if (!busy()) ui.drop.hidden = false; }
      if (type === "dragleave") { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) ui.drop.hidden = true; }
      if (type === "drop") {
        dragDepth = 0;
        ui.drop.hidden = true;
        if (busy()) return;
        if (event.dataTransfer.files.length !== 1) { notice("一度に投入できる画像は1枚です。"); return; }
        loadFile(event.dataTransfer.files[0]);
      }
    });
  }
  $("spec-button").addEventListener("click", () => {
    if (!ui.spec.textContent) ui.spec.textContent = JSON.parse($("spec-source").textContent);
    ui.dialog.showModal();
  });
  $("spec-close").addEventListener("click", () => ui.dialog.close());
  ui.dialog.addEventListener("click", (event) => {
    if (event.target !== ui.dialog) return;
    const bounds = ui.dialog.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) ui.dialog.close();
  });
  new ResizeObserver(resize).observe(ui.stage);
  window.addEventListener("pagehide", () => { revision += 1; stopVisuals(); engine.invalidate(); });
  window.addEventListener("pageshow", (event) => { if (event.persisted) reset(); });
  setTarget(20);
  updateMotion();
  loadFile(sampleFile());
})();

</script>
</body>
